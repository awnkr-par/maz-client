name: Build MazLauncher Linux Preview

on:
  workflow_dispatch:
  push:
    branches: [main, linux-launcher-foundation]
    paths:
      - 'launcher/MazLauncher.Linux/**'
      - 'linux/**'
      - '.github/workflows/linux-launcher.yml'
  pull_request:
    paths:
      - 'launcher/MazLauncher.Linux/**'
      - 'linux/**'
      - '.github/workflows/linux-launcher.yml'

permissions:
  contents: read

jobs:
  linux-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Avalonia Linux x64
        run: dotnet publish launcher/MazLauncher.Linux/MazLauncher.Linux.csproj -c Release -r linux-x64 --self-contained true -o out/linux-x64
      - name: Package Avalonia preview
        run: tar -czf MazLauncher-Linux-x64-preview.tar.gz -C out/linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: MazLauncher-Linux-x64-preview
          path: MazLauncher-Linux-x64-preview.tar.gz
      - name: Check Python desktop source
        run: python3 -m compileall -q linux
      - name: Build Debian preview
        run: bash linux/build-deb.sh 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: MazLauncher-Linux-deb-preview
          path: dist/*.deb
