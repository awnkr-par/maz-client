name: Publish MazLauncher Linux Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'launcher/MazLauncher.Linux/**'
      - '.github/workflows/linux-launcher.yml'

permissions:
  contents: write

concurrency:
  group: mazlauncher-linux-release
  cancel-in-progress: true

jobs:
  linux-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Linux x64
        run: dotnet publish launcher/MazLauncher.Linux/MazLauncher.Linux.csproj -c Release -r linux-x64 --self-contained true -o out/linux-x64
      - name: Package
        run: |
          chmod +x out/linux-x64/MazLauncher.Linux
          tar -czf MazLauncher-Linux-x64-preview.tar.gz -C out/linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: MazLauncher-Linux-x64-preview
          path: MazLauncher-Linux-x64-preview.tar.gz
      - name: Publish Linux-only release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' launcher/MazLauncher.Linux/MazLauncher.Linux.csproj | head -1)
          test -n "$VERSION"
          TAG="linux-launcher-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MazLauncher-Linux-x64-preview.tar.gz --clobber
          else
            gh release create "$TAG" MazLauncher-Linux-x64-preview.tar.gz --title "MazLauncher Linux v$VERSION (Preview)" --notes "Linux x64 early preview. Does not launch Minecraft yet." --prerelease --target "$GITHUB_SHA"
          fi
