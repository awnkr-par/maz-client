name: Publish MazClient Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'launcher/MazLauncher/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'CHANGELOG.md'
      - 'LAUNCHER_CHANGELOG.md'
      - '.github/workflows/client-release.yml'

permissions:
  contents: write

concurrency:
  group: mazclient-versioned-release
  cancel-in-progress: true

jobs:
  release-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build MazClient
        shell: pwsh
        run: |
          gradle clean build --stacktrace
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Minecraft mappings/build unavailable; release will reuse the last verified cloud-channel MazClient JAR.'
            exit 0
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate MazLauncher icon
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File launcher/MazLauncher/generate-icon.ps1

      - name: Publish MazLauncher
        shell: pwsh
        run: |
          dotnet restore launcher/MazLauncher/MazLauncher.csproj
          dotnet publish launcher/MazLauncher/MazLauncher.csproj -c Release -r win-x64 --self-contained true -o launcher/publish

      - name: Smoke test MazLauncher EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path launcher/publish/MazLauncher.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            throw "MazLauncher smoke test failed: process exited early with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'MazLauncher stayed alive for the smoke-test window.'

      - name: Bundle current MazClient JAR internally
        id: versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path launcher/publish/payload | Out-Null

          $modVersionLine = Select-String -Path gradle.properties -Pattern '^mod_version=' | Select-Object -First 1
          if (-not $modVersionLine) { throw 'mod_version was not found.' }
          $clientVersion = ($modVersionLine.Line -split '=', 2)[1].Trim()
          $jar = "build/libs/maz-client-$clientVersion.jar"
          if (-not (Test-Path $jar)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $jar) | Out-Null
            $fallbackDir = Split-Path $jar
            gh release download cloud --pattern maz-client.jar --dir $fallbackDir --clobber
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $fallbackDir 'maz-client.jar'))) { throw 'Fallback MazClient JAR download failed.' }
            Move-Item (Join-Path $fallbackDir 'maz-client.jar') $jar -Force
            if ((Get-Item $jar).Length -lt 1024) { throw 'Fallback MazClient JAR download was empty.' }
          }
          Copy-Item $jar launcher/publish/payload/maz-client.jar -Force

          # Bundle the full requested Fabric mod stack into the installer. Runtime
          # Modrinth resolution remains as an update/fallback path, but fresh installs
          # no longer depend on network resolution to receive these mods.
          $managedMods = @(
            @{ Slug = 'sodium-extra'; Prefix = 'sodium-extra' },
            @{ Slug = 'reeses-sodium-options'; Prefix = 'reeses' },
            @{ Slug = 'balm'; Prefix = 'balm' },
            @{ Slug = 'walksylib'; Prefix = 'walksylib' },
            @{ Slug = 'complete-shield-fixes'; Prefix = 'shield' },
            @{ Slug = 'crosshair-addons-public'; Prefix = 'crosshair' },
            @{ Slug = 'ukulib'; Prefix = 'ukulib' },
            @{ Slug = 'totemcounter'; Prefix = 'totemcounter' },
            @{ Slug = 'ukus-armor-hud'; Prefix = 'armor-hud' },
            @{ Slug = 'statuseffecttimer'; Prefix = 'statuseffecttimer' },
            @{ Slug = 'multi-key-bindings'; Prefix = 'multi-key-bindings' },
            @{ Slug = 'cloth-config'; Prefix = 'cloth-config' },
            @{ Slug = 'moreculling'; Prefix = 'moreculling' },
            @{ Slug = 'zconfig'; Prefix = 'zconfig' },
            @{ Slug = 'zfastnoise'; Prefix = 'zfastnoise' },
            @{ Slug = 'mouse-tweaks'; Prefix = 'MouseTweaks' },
            @{ Slug = 'record-able'; Prefix = 'record-able' }
          )
          $managedDir = 'launcher/publish/payload/managed-mods'
          New-Item -ItemType Directory -Force -Path $managedDir | Out-Null
          $managedManifest = @{}
          foreach ($mod in $managedMods) {
            $uri = "https://api.modrinth.com/v2/project/$($mod.Slug)/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.2%22%5D"
            $versions = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $versions = @(Invoke-RestMethod -Uri $uri -Headers @{ 'User-Agent' = 'MazClient-Release/1.0' } -TimeoutSec 20)
                break
              }
              catch {
                if ($attempt -eq 3) { throw }
                Write-Warning "Modrinth metadata request failed for $($mod.Slug) on attempt $attempt/3: $($_.Exception.Message)"
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            $version = $versions | Where-Object { $_.version_type -eq 'release' } | Select-Object -First 1
            if (-not $version) { throw "No Fabric 26.2 release found for required mod $($mod.Slug)." }
            $file = $version.files | Where-Object { $_.primary -eq $true } | Select-Object -First 1
            if (-not $file) { $file = $version.files | Select-Object -First 1 }
            if (-not $file -or [string]::IsNullOrWhiteSpace($file.url)) { throw "No downloadable JAR found for required mod $($mod.Slug)." }
            $target = Join-Path $managedDir $file.filename
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $file.url -OutFile $target -Headers @{ 'User-Agent' = 'MazClient-Release/1.0' } -TimeoutSec 60
                break
              }
              catch {
                if (Test-Path $target) { Remove-Item $target -Force }
                if ($attempt -eq 3) { throw }
                Write-Warning "Managed JAR download failed for $($mod.Slug) on attempt $attempt/3: $($_.Exception.Message)"
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            if (-not (Test-Path $target) -or (Get-Item $target).Length -lt 1024) { throw "Bundled JAR validation failed for $($mod.Slug)." }
            $managedManifest[$mod.Slug] = $file.filename
            Write-Host "Bundled $($mod.Slug): $($file.filename)"
          }
          $managedManifest | ConvertTo-Json -Compress | Set-Content -Path (Join-Path $managedDir 'manifest.json') -Encoding utf8
          if (@(Get-ChildItem $managedDir -Filter '*.jar').Count -ne $managedMods.Count) {
            throw "Managed mod payload is incomplete."
          }

          [xml]$project = Get-Content launcher/MazLauncher/MazLauncher.csproj
          $launcherVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($launcherVersion)) { throw 'Launcher version was not found.' }

          "client_version=$clientVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "launcher_version=$launcherVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Bundled MazClient $clientVersion inside MazLauncher $launcherVersion installer payload."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' launcher/installer/MazLauncher.iss

      - name: Name public installer
        id: installer
        shell: pwsh
        run: |
          $clientVersion = '${{ steps.versions.outputs.client_version }}'
          $launcherVersion = '${{ steps.versions.outputs.launcher_version }}'
          $source = Get-ChildItem dist/MazLauncher-Setup-*.exe | Select-Object -First 1
          if (-not $source) { throw 'MazLauncher installer was not built.' }

          $publicName = "MazClient-$clientVersion-MazLauncher-$launcherVersion-Setup.exe"
          $publicPath = Join-Path dist $publicName
          Move-Item $source.FullName $publicPath -Force

          "public_name=$publicName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer renamed to $publicName"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_VERSION: ${{ steps.versions.outputs.client_version }}
          LAUNCHER_VERSION: ${{ steps.versions.outputs.launcher_version }}
          PUBLIC_NAME: ${{ steps.installer.outputs.public_name }}
        shell: pwsh
        run: |
          $clientVersion = $env:CLIENT_VERSION
          $launcherVersion = $env:LAUNCHER_VERSION
          $publicName = $env:PUBLIC_NAME
          $publicPath = Join-Path dist $publicName
          if (-not (Test-Path $publicPath)) { throw "Installer missing at $publicPath" }

          $clientTag = "v$clientVersion"
          gh release view $clientTag 2>$null
          $clientReleaseExists = $LASTEXITCODE -eq 0

          if ($clientReleaseExists) {
            # The MazClient version already has its canonical v* release, so this is a
            # launcher-only distribution update. Never rewrite the old client release:
            # publish a fresh launcher tag and use LAUNCHER_CHANGELOG.md verbatim.
            $tag = "launcher-v$launcherVersion"
            $title = "MazLauncher $launcherVersion"
            $changelogPath = 'LAUNCHER_CHANGELOG.md'
            $sectionVersion = $launcherVersion
            $heading = "# MazLauncher $launcherVersion"
            $downloadText = "Download **$publicName** below to install MazLauncher $launcherVersion with MazClient $clientVersion."
          }
          else {
            # A new MazClient version owns the canonical v* release and remains what
            # MazLauncher version discovery reads from GitHub.
            $tag = $clientTag
            $title = "MazClient $clientVersion"
            $changelogPath = 'CHANGELOG.md'
            $sectionVersion = $clientVersion
            $heading = "# MazClient $clientVersion"
            $downloadText = "Download **$publicName** below to install MazLauncher with MazClient $clientVersion."
          }

          $changelog = Get-Content $changelogPath
          $header = "## $sectionVersion"
          $start = [Array]::IndexOf($changelog, $header)
          if ($start -lt 0) { throw "$changelogPath has no section for $sectionVersion." }

          $end = $changelog.Length
          for ($i = $start + 1; $i -lt $changelog.Length; $i++) {
            if ($changelog[$i] -match '^##\s+') { $end = $i; break }
          }

          $bodyLines = @()
          if ($end -gt ($start + 1)) { $bodyLines = $changelog[($start + 1)..($end - 1)] }
          $body = ($bodyLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) { throw "Release notes for $sectionVersion are empty." }

          $notesPath = 'dist/release-notes.md'
          @(
            $heading,
            "",
            $body,
            "",
            "### Download",
            $downloadText
          ) | Set-Content -Encoding utf8 $notesPath

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Reruns repair only the release for this exact component version.
            gh release edit $tag --title $title --notes-file $notesPath --target $env:GITHUB_SHA
          }
          else {
            gh release create $tag --target $env:GITHUB_SHA --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0 -and $tag -like 'launcher-v*') {
              # Some repository integration tokens can update existing releases but cannot
              # create new release records. Preserve a public installer by updating the
              # previous launcher release if creation of the next tag is denied.
              $fallbackTag = 'launcher-v0.6.68'
              gh release edit $fallbackTag --title $title --notes-file $notesPath --target $env:GITHUB_SHA
              if ($LASTEXITCODE -eq 0) { $tag = $fallbackTag }
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to create or update release $tag." }

          $assetsJson = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($asset in $assetsJson.assets) {
            if ($asset.name -ne $publicName) {
              Write-Host "Removing stale public release asset: $($asset.name)"
              gh release delete-asset $tag $asset.name -y
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove stale release asset: $($asset.name)" }
            }
          }

          gh release upload $tag $publicPath --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload public installer.' }

          $verified = gh release view $tag --json tagName,name,isDraft,isPrerelease,url,body,assets,targetCommitish | ConvertFrom-Json
          $unexpected = @($verified.assets | Where-Object { $_.name -ne $publicName })
          if ($unexpected.Count -gt 0) {
            throw "Release verification failed: unexpected public assets remain: $($unexpected.name -join ', ')"
          }
          if (@($verified.assets).Count -ne 1) {
            throw "Release verification failed: expected exactly one public installer asset, found $(@($verified.assets).Count)."
          }
          if ($verified.assets[0].name -ne $publicName) {
            throw "Release verification failed: expected $publicName, found $($verified.assets[0].name)."
          }
          if ($verified.targetCommitish -ne $env:GITHUB_SHA) {
            throw "Release verification failed: expected target $env:GITHUB_SHA, found $($verified.targetCommitish)."
          }

          # GitHub normalizes line endings in release bodies, and wildcard matching can
          # misinterpret Markdown '*' and '[' characters. Normalize newlines and use a
          # literal ordinal substring check so valid changelog notes do not fail CI.
          $publishedNotes = (($verified.body -replace "`r`n", "`n") -replace "`r", "`n").Trim()
          $expectedNotes = (($body -replace "`r`n", "`n") -replace "`r", "`n").Trim()
          if ($publishedNotes.IndexOf($expectedNotes, [System.StringComparison]::Ordinal) -lt 0) {
            throw "Release verification failed: published notes do not contain the matching changelog section."
          }
          $verified | ConvertTo-Json -Depth 8
