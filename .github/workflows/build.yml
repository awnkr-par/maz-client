name: Build

on:
  push:
    branches: [ main, mc-1.21.11 ]
  pull_request:
    branches: [ main ]

concurrency:
  group: maz-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload MazClient jar
        uses: actions/upload-artifact@v4
        with:
          name: maz-client-26.2
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  launcher-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate MazLauncher icon
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File launcher/MazLauncher/generate-icon.ps1

      - name: Publish MazLauncher
        shell: pwsh
        run: |
          dotnet restore launcher/MazLauncher/MazLauncher.csproj
          dotnet publish launcher/MazLauncher/MazLauncher.csproj -c Release -r win-x64 --self-contained true -o launcher/publish

      - name: Smoke test MazLauncher EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path launcher/publish/MazLauncher.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            throw "MazLauncher smoke test failed: process exited early with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'MazLauncher stayed alive for the smoke-test window.'
